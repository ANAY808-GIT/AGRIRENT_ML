version: '3.8'

services:
  agrirent-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrirent-ml-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=agrirent_production_super_secret_key_2026
      - MYSQL_HOST=mysql-db
      - MYSQL_PORT=3306
      - MYSQL_USER=agrirent_user
      - MYSQL_PASSWORD=agrirent_secure_pass
      - MYSQL_DB=agrirent_db
    depends_on:
      mysql-db:
        condition: service_healthy
    restart: unless-stopped

  mysql-db:
    image: mysql:8.0
    container_name: agrirent-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_secure_pass_2026
      - MYSQL_DATABASE=agrirent_db
      - MYSQL_USER=agrirent_user
      - MYSQL_PASSWORD=agrirent_secure_pass
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secure_pass_2026"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql-data:
